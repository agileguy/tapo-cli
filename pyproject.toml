[project]
name = "tapo-cli"
version = "0.0.2"
description = "Deterministic local-LAN CLI for TP-Link Tapo cameras and doorbells"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
authors = [{ name = "Dan Elliott" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Video :: Capture",
  "Topic :: System :: Networking",
]
dependencies = [
  # pytapo pinned to a specific main-branch SHA per SRD §16.0 (Phase 0).
  # SHA verified 2026-04-28 via: gh api repos/JurajNyiri/pytapo/commits/main
  # Commit: "Merge pull request #163 from ramast/main — Added support for logo
  # parameter in setOsd and getOsd" (authored 2026-04-14).
  "pytapo @ git+https://github.com/JurajNyiri/pytapo@de5ca3787c710151185bc72a35945d4091727c1e",
  "onvif-zeep-async>=4.0.4,<5",
  "WSDiscovery>=2.1.2,<3",
  "click>=8.1",
  "httpx>=0.27",
]

[project.scripts]
tapo-cli = "tapo_cli.__main__:main"

[project.urls]
Repository = "https://github.com/agileguy/tapo-cli"
Issues = "https://github.com/agileguy/tapo-cli/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# pytapo is pinned by git SHA per SRD §16.0. Direct references require this opt-in.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tapo_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
